<!--
  DISTRIBUIDORA MB · Base de datos de clientes (v2.3 · Fase 3 · R1)
  Clientes (alta, edición, búsqueda, filtros y completitud), «Pendientes de completar» con edición rápida en línea,
  historial por cliente (ventas, servicios e importados), «Unificar y vincular» (variantes de una misma clienta y servicios
  sin cliente) e «Importación» del historial (bandeja → revisión → aprobación en lote), con exportación CSV.
  Se incluye en Index.html con <?!= incluir_('UI_Clientes') ?> y se conecta a la app por window.MB.
  Lo que decide (obligatorios, RUC, duplicados, completitud, estados de la importación) lo valida el SERVIDOR: aquí solo
  se muestra una estimación para orientar mientras se escribe.
-->
<style>
  /* ═════════════ Base de datos (v2.3) ═════════════ */
  .bd-faltan { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .bd-faltan .badge { font-size: 10.5px; }
  .bd-tarjetas { margin: 14px -22px 0; border-top: 1px solid var(--linea); }
  .bd-tarjeta { display: grid; grid-template-columns: minmax(190px, 250px) 1fr auto; gap: 12px 22px; align-items: start; padding: 14px 22px; border-bottom: 1px solid var(--linea); }
  .bd-tarjeta-acc { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 18px; white-space: nowrap; }
  .bd-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 12px; }
  .bd-campos .campo > label { font-size: 11px; }
  .bd-campos input, .bd-campos select { min-height: 34px; padding: 6px 9px; font-size: 13px; }
  .bd-grupo { border: 1px solid var(--linea); border-radius: 4px; background: var(--superficie); padding: 14px 16px; margin-top: 12px; }
  .bd-grupo-cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .bd-miembro { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linea); font-size: 13px; }
  .bd-miembro:first-of-type { border-top: 0; }
  .bd-miembro input { width: 16px; height: 16px; min-height: 0; margin: 0; accent-color: var(--tinta); }
  .bd-archivo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bd-pasos { counter-reset: paso; list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--tinta-2); }
  .bd-pasos li { counter-increment: paso; padding-left: 26px; position: relative; }
  .bd-pasos li::before { content: counter(paso); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--acento-suave); color: var(--acento); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .bd-original { font-size: 11.5px; color: var(--tenue); max-width: 420px; overflow-wrap: anywhere; margin-top: 2px; }
  .bd-original summary { cursor: pointer; width: max-content; text-decoration: underline; text-underline-offset: 2px; }
  .bd-original[open] summary { margin-bottom: 2px; }
  .bd-sel { width: 34px; }
  .bd-sel input { width: 16px; height: 16px; min-height: 0; margin: 0; accent-color: var(--tinta); }
  .bd-enlace { margin-bottom: 14px; }
  .bd-prev { font-size: 12px; margin-top: 6px; }
  .bd-kpis-modal .kpi { padding: 14px 16px; }
  .bd-kpis-modal .kpi-val { font-size: 19px; overflow-wrap: anywhere; }
  textarea.bd-pegar { min-height: 120px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (max-width: 720px) {
    .bd-miembro { grid-template-columns: auto auto 1fr; } .bd-miembro .acciones { grid-column: 1 / -1; text-align: left; }
    .bd-tarjetas { margin: 12px -16px 0; }
    .bd-tarjeta { grid-template-columns: 1fr; padding: 14px 16px; }
    .bd-tarjeta-acc { flex-direction: row; align-items: center; padding-top: 0; }
  }
</style>
<script>
(window.MB_EXT = window.MB_EXT || []).push(function (MB) {
  'use strict';
  var S = MB.S, $ = MB.$, esc = MB.esc, gs = MB.gs, miles = MB.miles, fecha = MB.fecha, plural = MB.plural,
    badge = MB.badge, boton = MB.boton, attr = MB.attr, tabla = MB.tabla, kpi = MB.kpi, cabecera = MB.cabecera,
    subtabs = MB.subtabs, campo = MB.campo, inputGs = MB.inputGs, api = MB.api, toast = MB.toast, fallo = MB.fallo,
    conBoton = MB.conBoton, abrirModal = MB.abrirModal, requerir = MB.requerir, enteroDe = MB.enteroDe, norm = MB.norm, uid = MB.uid;

  var TIPOS = ['PELUQUERÍA', 'CLIENTA DEL SALÓN', 'OTRO'];
  var REQ = {
    EMPRESA: [['nombre', 'Nombre comercial'], ['razonSocial', 'Razón social'], ['ruc', 'RUC'], ['contacto', 'Contacto principal'], ['direccion', 'Dirección'], ['celular', 'Celular'], ['ciudad', 'Ciudad']],
    SALON: [['nombre', 'Nombre'], ['celular', 'Celular']],
  };
  // Etiqueta de «Campos faltantes» → campo que la completa (edición rápida).
  var CAMPO_DE = { 'Tipo de cliente': 'tipo', 'Nombre comercial': 'nombre', 'Nombre': 'nombre', 'Razón social': 'razonSocial', 'RUC': 'ruc', 'RUC válido': 'ruc',
    'Contacto principal': 'contacto', 'Dirección': 'direccion', 'Celular': 'celular', 'Celular válido': 'celular', 'Ciudad': 'ciudad', 'CI válida': 'ci' };
  var ETQ = { tipo: 'Tipo de cliente', nombre: 'Nombre', razonSocial: 'Razón social', ruc: 'RUC (1234567-8)', contacto: 'Contacto principal', direccion: 'Dirección',
    celular: 'Celular', ciudad: 'Ciudad', ci: 'CI (solo números)' };
  var ESTADOS_IMP = { LISTO: 'ok', REVISAR: 'alerta', DUPLICADO: 'neutro', APROBADO: 'ok', RECHAZADO: 'neutro', 'YA EN LA BANDEJA': 'neutro' };

  // Estado de las pantallas (filtros, borradores de la edición rápida, importación y selección).
  var B = S.base = {
    q: '', tipo: 'todos', comp: 'todas', inactivos: false, pq: '', borrador: {}, verMas: 0, archivo: null,
    imp: { texto: '', fuente: '', referencia: '', total: '', archivo: null, nombreArchivo: '', vista: null, lote: '', estado: '', filas: null, nFilas: 0, resumen: null, sel: {}, descontar: false, motivoStock: '' },
    vinc: { sel: {}, cliente: '' },
  };

  // ═════════════ Utilidades ═════════════
  function D() { return S.datos; }
  function hayBase() { return !!(S.datos && S.datos.clientes); }
  function K() { return S.datos.clientes; }
  function esAdmin() { return MB.esAdmin(); }
  function render() { MB.render(); }
  function opcion(valor, texto, sel) { return '<option value="' + esc(valor) + '"' + (sel ? ' selected' : '') + '>' + esc(texto) + '</option>'; }
  function aviso(txt, tono) { return '<p class="aviso-linea' + (tono ? ' ' + tono : '') + '">' + esc(txt) + '</p>'; }
  function cliente(codigo) { return hayBase() ? MB.buscar(K().lista, codigo) : null; }
  function minus(t) { return String(t === null || t === undefined ? '' : t).toLowerCase(); }
  function tipoCorto(t) { return { 'PELUQUERÍA': 'Peluquería', 'CLIENTA DEL SALÓN': 'Clienta del salón', 'OTRO': 'Otro' }[t] || 'Sin tipo'; }
  function badgeCompletitud(c) { return c.completitud === 'COMPLETA' ? badge('Completa', 'ok') : badge('Incompleta', 'alerta'); }
  function chipsFaltan(lista) {
    return lista && lista.length ? '<div class="bd-faltan">' + lista.map(function (f) { return badge(f, /válid/.test(f) ? 'error' : 'neutro'); }).join('') + '</div>' : '';
  }
  function hayCartera() { return !!(S.datos && S.datos.cartera); }

  // Estimación en el navegador (orienta; el servidor decide): dígito verificador del RUC (módulo 11 de la SET).
  function dvRuc(base) {
    var s = String(base).toUpperCase().split('').map(function (ch) { return /\d/.test(ch) ? ch : String(ch.charCodeAt(0)); }).join('');
    var k = 2, total = 0;
    for (var i = s.length - 1; i >= 0; i--) { total += Number(s.charAt(i)) * k; k = k >= 11 ? 2 : k + 1; }
    var resto = total % 11;
    return resto > 1 ? 11 - resto : 0;
  }
  function rucValido(v) {
    var s = String(v || '').toUpperCase().replace(/\s+/g, '').replace(/\./g, '');
    var m = s.match(/^(\d{3,9})-(\d)$/);
    if (!m) return false;
    return !hayBase() || K().validarDv === false || dvRuc(m[1]) === Number(m[2]);
  }
  function faltantesUI(d, hoja) {
    var tipo = d.tipo || (hoja === 'clientasSalon' ? 'CLIENTA DEL SALÓN' : 'PELUQUERÍA');
    var lista = [];
    if (!d.tipo) lista.push('Tipo de cliente');
    (tipo === 'CLIENTA DEL SALÓN' ? REQ.SALON : REQ.EMPRESA).forEach(function (r) {
      var v = String(d[r[0]] || '').trim();
      if (r[0] === 'ruc') { if (!v) lista.push('RUC'); else if (!rucValido(v)) lista.push('RUC válido'); return; }
      if (r[0] === 'celular') {
        var cel = v ? MB.whatsappDe(v) : MB.whatsappDe(d.telefono);
        if (!cel) lista.push(v ? 'Celular válido' : 'Celular');
        return;
      }
      if (!v) lista.push(r[1]);
    });
    if (tipo === 'CLIENTA DEL SALÓN' && String(d.ruc || '').trim() && !rucValido(d.ruc)) lista.push('RUC válido');
    if (String(d.ci || '').trim() && !/^\d{3,10}$/.test(String(d.ci).replace(/[.\s]/g, ''))) lista.push('CI válida');
    return lista;
  }
  function mostrarEnlace(r) {
    if (!r || !r.url) return;
    B.archivo = { nombre: r.nombre, url: r.url };
    render();
  }
  function enlaceArchivo() {
    if (!B.archivo) return '';
    return '<p class="aviso-linea bien bd-enlace">Archivo listo: <a href="' + esc(B.archivo.url) + '" target="_blank" rel="noopener">' + esc(B.archivo.nombre) + '</a> ' +
      '(en «Distribuidora MB»). ' + boton('Ocultar', 'bd-ocultar-enlace') + '</p>';
  }

  // ═════════════ Vista: Base de datos ═════════════
  function vClientes() {
    if (!hayBase()) return cabecera('Base de datos', 'Clientes') + '<div class="vacio">La base de clientes todavía no está instalada en el servidor (Fase 3).</div>';
    var k = K(), admin = esAdmin(), r = k.resumen;
    var opciones = [['lista', 'Clientes'], ['pendientes', 'Pendientes de completar', r.incompletas || '']];
    if (admin) {
      var nU = (k.unificaciones || []).length + ((k.serviciosSinCliente || {}).conNombre ? 1 : 0);
      var imp = k.importacion || { porEstado: {} };
      opciones.push(['unificar', 'Unificar y vincular', nU || ''], ['importacion', 'Importación', (imp.porEstado.REVISAR || 0) + (imp.porEstado.LISTO || 0) || '']);
    }
    if (!admin && (S.sub.clientes === 'unificar' || S.sub.clientes === 'importacion')) S.sub.clientes = 'lista';
    var html = cabecera('Base de datos', 'Clientes · peluquerías, clientas del salón y otros',
      boton('Nuevo cliente', 'bd-nuevo', '', 'btn') + (admin ? ' ' + boton('Exportar CSV', 'bd-exportar', attr('tipo', 'base'), 'btn btn-sec') : ''));
    html += enlaceArchivo() + subtabs('clientes', opciones);
    var sub = S.sub.clientes;
    if (sub === 'pendientes') return html + vPendientes();
    if (sub === 'unificar') return html + vUnificar();
    if (sub === 'importacion') return html + vImportacion();
    return html + vLista();
  }

  function vLista() {
    var k = K(), r = k.resumen;
    var pt = r.porTipo || {};
    var html = '<div class="kpis kpis-4">' +
      kpi('Clientes activos', miles(r.activos), plural(r.total, 'ficha en total', 'fichas en total') + ' (C- peluquerías y otros · CS- clientas del salón)') +
      kpi('Completas', miles(r.completas), 'con todos los datos obligatorios de su tipo') +
      kpi('Incompletas', miles(r.incompletas), 'no compran a crédito hasta completarlas', r.incompletas ? 'alerta' : '') +
      kpi('Por tipo', miles(pt['PELUQUERÍA'] || 0) + ' · ' + miles(pt['CLIENTA DEL SALÓN'] || 0) + ' · ' + miles(pt.OTRO || 0),
        'peluquerías · clientas del salón · otros' + (pt['SIN TIPO'] ? ' · ' + plural(pt['SIN TIPO'], 'sin tipo', 'sin tipo') : '')) + '</div>';
    html += '<div class="barra-herr mt-l"><input type="search" placeholder="Buscar nombre, código, RUC, CI, celular, alias o código legado" value="' + esc(B.q) +
      '" data-al-escribir="bd-buscar" autocomplete="off">' +
      '<div style="min-width:170px"><select data-al-cambiar="bd-tipo" aria-label="Filtrar por tipo">' +
      [['todos', 'Todos los tipos'], ['PELUQUERÍA', 'Peluquerías'], ['CLIENTA DEL SALÓN', 'Clientas del salón'], ['OTRO', 'Otros'], ['', 'Sin tipo']]
        .map(function (o) { return opcion(o[0], o[1], B.tipo === o[0]); }).join('') + '</select></div>' +
      '<div style="min-width:160px"><select data-al-cambiar="bd-comp" aria-label="Filtrar por completitud">' +
      [['todas', 'Completas e incompletas'], ['INCOMPLETA', 'Solo incompletas'], ['COMPLETA', 'Solo completas']].map(function (o) { return opcion(o[0], o[1], B.comp === o[0]); }).join('') +
      '</select></div><label class="check"><input type="checkbox" data-al-cambiar="bd-inactivos"' + (B.inactivos ? ' checked' : '') + '> Ver inactivos</label></div>';
    return html + '<div id="bd-tabla">' + tablaClientes() + '</div>' +
      '<p class="nota-pie">Obligatorios: peluquería u otro → nombre comercial, razón social, RUC (con dígito verificador), contacto principal, dirección, celular y ciudad; ' +
      'clienta del salón → nombre y celular (RUC o CI solo si pide factura). Un alta incompleta se rechaza; lo cargado antes o importado queda INCOMPLETA con la lista exacta de faltantes ' +
      'y no compra a crédito hasta completarse. RUC y CI no se repiten en ninguna de las dos hojas.</p>';
  }
  function filtrarClientes() {
    var q = norm(B.q).trim();
    return K().lista.filter(function (c) {
      if (!B.inactivos && !c.activo) return false;
      if (B.tipo !== 'todos' && (c.tipo || '') !== B.tipo) return false;
      if (B.comp !== 'todas' && c.completitud !== B.comp) return false;
      if (!q) return true;
      return norm([c.codigo, c.nombre, c.razonSocial, c.contacto, c.ruc, c.ci, c.celular, c.telefono, c.alias, c.legado, c.ciudad, c.correo].join(' ')).indexOf(q) >= 0;
    });
  }
  function tablaClientes() {
    var lista = filtrarClientes(), cart = hayCartera();
    var filas = lista.slice(0, 400).map(function (c) {
      var wa = c.whatsapp ? '<a class="btn-link" href="https://wa.me/' + esc(c.whatsapp) + '" target="_blank" rel="noopener">+' + esc(c.whatsapp) + '</a>' : '<span class="det">sin celular</span>';
      return '<tr class="' + (c.activo ? '' : 'fila-anulada') + '"><td><div class="fuerte">' + esc(c.nombre) + '</div><div class="det">' +
        esc([c.codigo, tipoCorto(c.tipo), c.legado ? 'legado ' + c.legado : '', c.razonSocial && c.razonSocial !== c.nombre ? c.razonSocial : '', c.unificadaEn ? 'unificada en ' + c.unificadaEn : ''].filter(String).join(' · ')) +
        '</div><div class="solo-movil">' + badgeCompletitud(c) + '</div></td>' +
        '<td class="ocultar-movil"><div>' + esc(c.contacto || '—') + '</div><div class="det">' + wa + '</div></td>' +
        '<td class="ocultar-movil"><div class="cod">' + esc(c.ruc || '—') + '</div>' + (c.ci ? '<div class="det">CI ' + esc(c.ci) + '</div>' : '') + '</td>' +
        '<td class="ocultar-movil">' + badgeCompletitud(c) + chipsFaltan(c.faltantes) + (c.revisar ? '<div class="mt">' + badge('Revisar unificación', 'alerta') + '</div>' : '') + '</td>' +
        '<td class="ocultar-movil">' + (c.categoria ? esc(c.categoria) : '<span class="det">sin categoría</span>') +
        (c.estadoCredito ? '<div class="det">' + esc(minus(c.estadoCredito)) + (c.saldo ? ' · saldo ' + gs(c.saldo) : '') + '</div>' : '') + '</td>' +
        '<td class="acciones">' + boton('Editar', 'bd-editar', attr('codigo', c.codigo)) + boton('Historial', 'bd-historial', attr('codigo', c.codigo)) +
        (cart ? boton('Estado de cuenta', 'ficha', attr('codigo', c.codigo)) : '') + '</td></tr>';
    });
    var pie = lista.length > 400 ? '<tfoot><tr><td colspan="6">Se muestran 400 de ' + miles(lista.length) + ': afine la búsqueda.</td></tr></tfoot>' :
      (lista.length ? '<tfoot><tr><td colspan="6">' + plural(lista.length, 'cliente', 'clientes') + '</td></tr></tfoot>' : '');
    return '<div class="tabla-plegable">' + tabla(['Cliente', ['Contacto y celular', 'ocultar-movil'], ['RUC / CI', 'ocultar-movil'], ['Datos', 'ocultar-movil'], ['Crédito', 'ocultar-movil'], ''],
      filas, 'Ningún cliente coincide con el filtro.', pie) + '</div>';
  }

  // ═════════════ Pendientes de completar (R1.4: edición rápida en línea) ═════════════
  function vPendientes() {
    var admin = esAdmin();
    var q = norm(B.pq).trim();
    var lista = K().lista.filter(function (c) { return c.activo && c.completitud === 'INCOMPLETA'; }).filter(function (c) {
      return !q || norm([c.codigo, c.nombre, c.contacto, c.legado, c.alias, c.faltantes.join(' ')].join(' ')).indexOf(q) >= 0;
    });
    var tope = 60 + B.verMas;
    var html = '<section class="panel"><div class="panel-cab"><h2>Pendientes de completar</h2>' +
      (admin ? boton('Exportar faltantes (CSV)', 'bd-exportar', attr('tipo', 'faltantes'), 'btn btn-sec') : '') + '</div>' +
      '<p class="ayuda">Complete solo lo que falta y pulse «Guardar» en esa fila: se guarda aunque siga incompleta (nunca se pierde lo ya cargado). ' +
      'Mientras una ficha esté INCOMPLETA no se le vende a crédito (ni factura electrónica ni WhatsApp cuando estén activos).</p>' +
      '<div class="barra-herr mt"><input type="search" placeholder="Buscar en los pendientes" value="' + esc(B.pq) + '" data-al-escribir="bd-pend-buscar" autocomplete="off"></div>';
    if (!lista.length) return html + '<div class="vacio">' + (q ? 'Ningún pendiente coincide con la búsqueda.' : 'No hay fichas incompletas.') + '</div></section>';
    html += '<div class="bd-tarjetas">' + lista.slice(0, tope).map(filaRapida).join('') + '</div>';
    if (lista.length > tope) html += '<div class="mt">' + boton('Ver ' + Math.min(60, lista.length - tope) + ' más (de ' + miles(lista.length - tope) + ')', 'bd-ver-mas', '', 'btn btn-sec') + '</div>';
    return html + '</section>';
  }
  function filaRapida(c) {
    var b = B.borrador[c.codigo] || {};
    var campos = [];
    c.faltantes.forEach(function (f) { var k = CAMPO_DE[f]; if (k && campos.indexOf(k) < 0) campos.push(k); });
    var controles = campos.map(function (k) {
      var actual = b[k] !== undefined ? b[k] : (k === 'tipo' ? c.tipo : (c[k] || ''));
      var ctrl;
      if (k === 'tipo') {
        ctrl = '<select name="tipo" data-al-cambiar="bd-borrador" data-codigo="' + esc(c.codigo) + '">' + opcion('', 'Elegir…', !actual) +
          TIPOS.map(function (t) { return opcion(t, tipoCorto(t), actual === t); }).join('') + '</select>';
      } else {
        ctrl = '<input name="' + k + '" value="' + esc(actual) + '" data-al-escribir="bd-borrador" data-codigo="' + esc(c.codigo) + '"' +
          (k === 'celular' ? ' inputmode="tel" placeholder="0981 123 456"' : (k === 'ruc' ? ' placeholder="1234567-8"' : (k === 'ci' ? ' inputmode="numeric"' : ''))) + '>';
      }
      return '<div class="campo"><label>' + esc(ETQ[k] || k) + '</label>' + ctrl + '</div>';
    }).join('');
    return '<article class="bd-tarjeta" data-fila-codigo="' + esc(c.codigo) + '"><div><div class="fuerte">' + esc(c.nombre) + '</div><div class="det">' +
      esc([c.codigo, tipoCorto(c.tipo), c.legado ? 'legado ' + c.legado : ''].filter(String).join(' · ')) + '</div>' + chipsFaltan(c.faltantes) + '</div>' +
      '<div class="bd-campos">' + (controles || '<span class="det">Revise la ficha completa.</span>') + '</div>' +
      '<div class="bd-tarjeta-acc">' + boton('Guardar', 'bd-rapida-guardar', attr('codigo', c.codigo), 'btn btn-sec') + boton('Ficha completa', 'bd-editar', attr('codigo', c.codigo)) + '</div></article>';
  }
  function guardarRapida(el) {
    var codigo = el.getAttribute('data-codigo');
    var fila = document.querySelector('.bd-tarjeta[data-fila-codigo="' + codigo + '"]');
    if (!fila) return;
    var datos = { codigoOriginal: codigo };
    var hay = false;
    Array.prototype.forEach.call(fila.querySelectorAll('input[name], select[name]'), function (x) {
      var v = String(x.value || '').trim();
      if (v) { datos[x.name] = v; hay = true; }
    });
    if (!hay) { toast('Escriba al menos un dato para guardar.', 'aviso'); return; }
    conBoton(el, 'Guardando…', function () { return api('guardarCliente', datos, 'rapida-' + codigo + '-' + uid()); }).then(function (r) {
      delete B.borrador[codigo];
      MB.aplicar(r);
    }).catch(fallo);
  }

  // ═════════════ Alta y edición (reemplaza «Nueva peluquería» / «Editar» de la v2.1) ═════════════
  function fld(nombre, etiqueta, control, cls, ayuda) {
    return '<div class="campo ' + (cls || 'c-6') + '"><label for="bd-f-' + nombre + '" id="bd-l-' + nombre + '" data-etq="' + esc(etiqueta) + '">' + esc(etiqueta) + '</label>' + control +
      '<span class="ayuda" id="bd-a-' + nombre + '">' + esc(ayuda || '') + '</span></div>';
  }
  function inp(nombre, valor, extra) {
    return '<input id="bd-f-' + nombre + '" name="' + nombre + '" value="' + esc(valor === null || valor === undefined ? '' : valor) + '"' + (extra || '') + '>';
  }
  /**

          '</div></td><td class="num">' + gs(x.total) + '</td></tr>';
      }).concat(v.servicios.map(function (s) {
        return '<tr><td class="cod">' + esc(s.id) + '</td><td>' + fecha(s.fecha) + '</td><td>' + esc(s.cliente) + '</td><td>servicio<div class="det">' + esc(s.item) + '</div></td><td class="num">' + gs(s.monto) + '</td></tr>';
      })), '') + '</div>';
  }
  function modalAprobar(lote) {
    var est = { huella: '', descontar: null };
    abrirModal({
      titulo: 'Aprobar el lote ' + lote, ancho: true, aceptar: 'Aprobar y pasar a Ventas',
      cuerpo: '<p class="ayuda">Solo las filas LISTO. Las ventas aprobadas llevan N° «H-» y Origen HISTÓRICO; una venta a crédito se concilia con el saldo HISTÓRICO de la clienta ' +
        '(9001–9020) y no se suma aparte. Los servicios quedan sin profesional ni comisión (se pagaron fuera del sistema).</p>' +
        '<div class="mt"><label class="check"><input type="checkbox" name="descontar"> Descontar stock (decisión explícita de una administradora)</label>' +
        '<p class="ayuda">Lo habitual es NO: el stock inicial cargado ya refleja estas ventas.</p></div>' +
        '<div class="campo mt" id="bd-ap-motivo" hidden><label>Motivo para descontar stock *</label><input name="motivoStock" maxlength="200"></div>' +
        '<div id="bd-ap-plan" class="mt"><p class="ayuda">Calculando el plan de aprobación…</p></div>',
      alCambiar: function (form) {
        var d = !!form.elements.descontar.checked;
        var m = $('#bd-ap-motivo');
        if (m) m.hidden = !d;
        if (d === est.descontar) return;
        est.descontar = d;
        est.huella = '';
        var b = $('#modal-aceptar');
        if (b) b.disabled = true;
        api('vistaPreviaAprobacion', { lote: lote, descontarStock: d }).then(function (r) {
          if (est.descontar !== d) return;
          est.huella = r.vista.huella;
          var cont = $('#bd-ap-plan');
          if (cont) cont.innerHTML = htmlPlan(r.vista);
          var b2 = $('#modal-aceptar');
          if (b2) b2.disabled = !(r.vista.ventas.length || r.vista.servicios.length);
        }).catch(function (e) { var cont = $('#bd-ap-plan'); if (cont) cont.innerHTML = aviso(e.message, 'grave'); });
      },
      alAceptar: function (f, idSol) {
        requerir(est.huella, 'Espere el plan de aprobación.');
        if (f.descontar) requerir(String(f.motivoStock || '').length >= 3, 'Escriba el motivo para descontar stock.');
        return api('aprobarImportacion', { lote: lote, descontarStock: !!f.descontar, motivoStock: f.motivoStock || '', confirmado: true, huella: est.huella }, idSol).then(function (r) {
          cargarBandeja(lote);
          return r;
        });
      },
    });
  }

  // ═════════════ Avisos en otras pantallas ═════════════
  /** Venta a crédito: aviso si la clienta elegida está INCOMPLETA (el servidor igual la rechaza). */
  function avisoVentaIncompleta() {
    var viejo = $('#bd-v-incompleta');
    if (viejo) viejo.remove();
    if (S.vista !== 'ventas' || !S.venta || S.venta.condicion !== 'Crédito' || !hayBase()) return;
    var sel = $('#v-cliente');
    if (sel) {
      Array.prototype.forEach.call(sel.options, function (o) {
        var c = cliente(o.value);
        if (c && c.completitud === 'INCOMPLETA' && o.textContent.indexOf('· INCOMPLETA') < 0) o.textContent += ' · INCOMPLETA';
      });
    }
    var c = cliente(S.venta.cliente);
    var ancla = $('#v-plan-estimado');
    if (!c || c.completitud !== 'INCOMPLETA' || !ancla) return;
    var div = document.createElement('div');
    div.id = 'bd-v-incompleta';
    div.innerHTML = '<p class="aviso-linea grave">CLIENTA INCOMPLETA: falta ' + esc(c.faltantes.join(', ')) + '. No se le vende a crédito hasta completar sus datos. ' +
      boton('Completar ahora', 'bd-editar', attr('codigo', c.codigo)) + '</p>';
    ancla.parentNode.insertBefore(div, ancla);
  }
  /** Sistema › Migración: qué agrega la Fase 3. */
  function notaMigracion() {
    if (S.vista !== 'sistema' || S.sub.sistema !== 'migracion' || $('#bd-nota-mig')) return;
    var ayuda = document.querySelector('#contenido .panel .ayuda');
    if (!ayuda) return;
    var p = document.createElement('p');
    p.id = 'bd-nota-mig';
    p.className = 'ayuda mt';
    p.textContent = 'Base de clientes (Fase 3): la migración también pasa las clientas de «Servicios realizados» a «Clientas salón» (una ficha INCOMPLETA por nombre distinto, ' +
      'sin «Sin nombre» ni vacíos), vincula sus servicios solo por nombre exacto y propone las variantes de una misma persona para revisar en Base de datos (nunca las fusiona).';
    ayuda.parentNode.insertBefore(p, ayuda.nextSibling);
  }

  // ═════════════ Conexión con la app ═════════════
  MB.vistas.clientes = vClientes;
  MB.ext.modalCliente = modalCliente;
  MB.ext.modalHistorial = modalHistorial;
  MB.ext.faltantesCliente = faltantesUI;

  var A = MB.acciones;
  // La ficha de la v2.1 («Nueva peluquería» / «Editar») pasa a ser la ficha completa de la base de clientes.
  A['nueva-peluqueria'] = function (el) { modalCliente(null, el.getAttribute('data-origen'), 'PELUQUERÍA'); };
  A['editar-peluqueria'] = function (el) { modalCliente(el.getAttribute('data-codigo')); };
  A['bd-nuevo'] = function () { modalCliente(null, null, 'PELUQUERÍA'); };
  A['bd-editar'] = function (el) { modalCliente(el.getAttribute('data-codigo')); };
  A['bd-historial'] = function (el) { modalHistorial(el.getAttribute('data-codigo')); };
  A['bd-exportar'] = function (el) {
    conBoton(el, 'Exportando…', function () { return api('exportarClientesCsv', { tipo: el.getAttribute('data-tipo') }, 'exp-' + uid()); }).then(function (r) {
      if (r.url) B.archivo = { nombre: r.nombre, url: r.url };
      MB.aplicar(r);
    }).catch(fallo);
  };
  A['bd-ocultar-enlace'] = function () { B.archivo = null; render(); };
  A['bd-ver-mas'] = function () { B.verMas += 60; render(); };
  A['bd-rapida-guardar'] = guardarRapida;
  A['bd-unificar'] = function (el) { resolverGrupo(el, 'unificar'); };
  A['bd-distintas'] = function (el) { resolverGrupo(el, 'distintas'); };
  A['bd-vincular-exactos'] = function (el) {
    conBoton(el, 'Vinculando…', function () { return api('vincularClienteServicio', { accion: 'exactos' }, 'vexact-' + uid()); }).then(MB.aplicar).catch(fallo);
  };
  A['bd-vincular'] = function (el) { vincularMarcados(el, false); };
  A['bd-desvincular'] = function (el) { vincularMarcados(el, true); };
  A['bd-crear-desde'] = function (el) { modalCliente(null, null, 'CLIENTA DEL SALÓN', { nombre: el.getAttribute('data-texto') }); };
  A['bd-plantilla'] = function (el) {
    conBoton(el, 'Preparando…', function () { return api('plantillaImportacion', {}, 'plantilla-' + uid()); }).then(function (r) {
      if (r.url) B.archivo = { nombre: r.nombre, url: r.url };
      MB.aplicar(r);
    }).catch(fallo);
  };
  A['bd-imp-vista'] = vistaImportacion;
  A['bd-imp-confirmar'] = confirmarImportacion;
  A['bd-imp-limpiar'] = function () { B.imp.vista = null; render(); };
  A['bd-imp-ver'] = function (el) { cargarBandeja(el.getAttribute('data-lote') || B.imp.lote || ''); };
  A['bd-imp-aprobar'] = function (el) { modalAprobar(el.getAttribute('data-lote')); };
  A['bd-imp-editar'] = function (el) { modalFilaImp(el.getAttribute('data-id')); };
  A['bd-imp-confirmar-lectura'] = function (el) { accionFilas([el.getAttribute('data-id')], 'confirmar'); };
  A['bd-imp-rechazar'] = function (el) { rechazarFilas([el.getAttribute('data-id')]); };
  A['bd-imp-reabrir'] = function (el) { accionFilas([el.getAttribute('data-id')], 'reabrir'); };
  A['bd-imp-aplicar-sel'] = aplicarSeleccion;
  A['bd-imp-rechazar-sel'] = function () { rechazarFilas(seleccionadas()); };

  MB.alEscribir['bd-buscar'] = function (el) { B.q = el.value; $('#bd-tabla').innerHTML = tablaClientes(); };
  MB.alEscribir['bd-pend-buscar'] = function (el) {
    B.pq = el.value;
    clearTimeout(B.tPend);
    B.tPend = setTimeout(function () {
      render();
      var x = document.querySelector('[data-al-escribir="bd-pend-buscar"]');
      if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); }
    }, 350);
  };
  MB.alEscribir['bd-borrador'] = function (el) { var c = el.getAttribute('data-codigo'); (B.borrador[c] = B.borrador[c] || {})[el.name] = el.value; };
  MB.alEscribir['bd-vinc-cliente'] = function (el) { B.vinc.cliente = el.value; };
  MB.alEscribir['bd-imp-campo'] = function (el) { B.imp[el.getAttribute('data-k')] = el.value; };
  MB.alEscribir['bd-imp-texto'] = function (el) { B.imp.texto = el.value; };
  MB.alCambio['bd-tipo'] = function (el) { B.tipo = el.value; $('#bd-tabla').innerHTML = tablaClientes(); };
  MB.alCambio['bd-comp'] = function (el) { B.comp = el.value; $('#bd-tabla').innerHTML = tablaClientes(); };
  MB.alCambio['bd-inactivos'] = function (el) { B.inactivos = el.checked; $('#bd-tabla').innerHTML = tablaClientes(); };
  MB.alCambio['bd-borrador'] = function (el) { var c = el.getAttribute('data-codigo'); (B.borrador[c] = B.borrador[c] || {})[el.name] = el.value; };
  MB.alCambio['bd-vinc-sel'] = function (el) { B.vinc.sel[el.getAttribute('data-id')] = el.checked; };
  MB.alCambio['bd-imp-csv'] = leerCsv;
  MB.alCambio['bd-imp-img'] = leerReferencia;
  MB.alCambio['bd-imp-filtro'] = function (el) {
    var k = el.getAttribute('data-k');
    B.imp[k] = el.value;
    if (k === 'estado') cargarBandeja();
  };
  MB.alCambio['bd-imp-sel'] = function (el) { B.imp.sel[el.getAttribute('data-id')] = el.checked; };

  // Acceso directo «?page=clientes» (menú opcional «MB Sistema» de la hoja): abre Base de datos una sola vez, al ingresar.
  var abrirBasePendiente = document.body.getAttribute('data-pagina') === 'clientes';
  var renderPrevio = MB.alRender;
  MB.alRender = function () {
    if (renderPrevio) renderPrevio();
    if (abrirBasePendiente && S.datos && hayBase()) {
      abrirBasePendiente = false;
      if (S.vista !== 'clientes') { S.vista = 'clientes'; render(); return; }
    }
    avisoVentaIncompleta();
    notaMigracion();
  };
});
</script>
