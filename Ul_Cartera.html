<!--
  DISTRIBUIDORA MB · Cartera de crédito y cobranzas (v2.3 · Fase 2 · R0)
  Clientas (estado y categoría), créditos y cuotas, cobros y conciliación, pendientes de la migración, cierre mensual,
  estado de cuenta (pantalla, impresión A4 y PDF), venta a crédito y la pestaña Sistema › Migración.
  Se incluye en Index.html con <?!= incluir_('UI_Cartera') ?> y se conecta a la app por window.MB.
  Todo lo que decide (plan, recargo, política, cascada, autorizaciones) lo calcula y valida el SERVIDOR:
  aquí solo se muestran estimaciones para orientar y se arman las pantallas.
-->
<style>
  /* ═════════════ Cartera (v2.3) ═════════════ */
  .datos-clienta { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .dato { background: var(--superficie-2); border: 1px solid var(--linea); border-radius: var(--radio); padding: 8px 10px; min-width: 0; }
  .dato-etq { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
  .dato-val { font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
  .aviso-linea { margin-top: 10px; font-size: 13px; padding: 9px 12px; border-radius: var(--radio); border-left: 3px solid var(--alerta); background: var(--alerta-suave); color: #6B4A10; }
  .aviso-linea.grave { border-left-color: var(--error); background: var(--error-suave); color: var(--error); }
  .aviso-linea.bien { border-left-color: var(--ok); background: var(--ok-suave); color: var(--ok); }
  .problemas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .problemas li { font-size: 13px; padding: 8px 12px; border-radius: var(--radio); border-left: 3px solid; }
  .problemas .duro { background: var(--error-suave); border-color: var(--error); color: var(--error); }
  .problemas .blando { background: var(--alerta-suave); border-color: var(--alerta); color: #6B4A10; }
  .problemas .info { background: var(--superficie-2); border-color: var(--linea-2); color: var(--tinta-2); }
  .tramos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tramo { background: var(--superficie); border: 1px solid var(--linea); border-top: 2px solid var(--linea-2); border-radius: 4px; padding: 12px 14px; min-width: 0; }
  .tramo-etq { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); }
  .tramo-val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tramo-det { font-size: 12px; color: var(--tenue); }
  .tramo.t0 { border-top-color: var(--ok); } .tramo.t1 { border-top-color: var(--alerta); }
  .tramo.t2, .tramo.t3, .tramo.t4, .tramo.t5 { border-top-color: var(--error); } .tramo.t6 { border-top-color: var(--linea-2); border-top-style: dashed; }
  .fila-detalle > td { background: var(--superficie-2); padding: 10px 14px 14px; }
  .fila-detalle .tabla-cont { margin: 0; }
  .sel-col { width: 34px; }
  .sel-col input { width: 16px; height: 16px; min-height: 0; margin: 0; accent-color: var(--tinta); }
  .barra-sel { position: sticky; bottom: 12px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--tinta); color: #fff; padding: 10px 14px; border-radius: 4px; box-shadow: 0 12px 30px rgba(0, 0, 0, .2); margin-top: 12px; font-size: 13px; }
  .barra-sel label { display: inline-flex; align-items: center; gap: 6px; }
  .barra-sel input { width: auto; min-height: 34px; padding: 5px 8px; }
  .barra-sel .btn { background: #fff; color: var(--tinta); border-color: #fff; min-height: 34px; }
  .barra-sel .btn-sec { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .5); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .lineas-cuotas { font-size: 12px; color: var(--tinta-2); margin-top: 4px; }
  .ec-marco { border: 1px solid var(--linea); border-radius: 4px; background: #fff; padding: 18px 20px; margin-top: 12px; max-height: 62vh; overflow: auto; }
  .cierre-bloque h3 { font-family: var(--serif, Georgia, serif); font-weight: normal; font-size: 16px; margin: 0 0 8px; }
  .totales-fila td { font-weight: 600; border-top: 1px solid var(--linea-2); }
  .resumen-mig { font-size: 14px; line-height: 1.5; }
  #zona-impresion { display: none; }
  @page { size: A4; margin: 14mm; }
  @media print {
    body.imprimiendo > *:not(#zona-impresion) { display: none !important; }
    body.imprimiendo #zona-impresion { display: block !important; }
    body.imprimiendo { background: #fff !important; }
  }
  @media (max-width: 900px) { .datos-clienta { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .datos-clienta, .tramos { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ec-marco { padding: 12px; } }
</style>
<!-- Estado de cuenta: estilos del documento (los manda el servidor) y zona que se imprime en A4 (fuera de la app). -->
<style id="ec-css"></style>
<div id="zona-impresion" aria-hidden="true"></div>
<script>
(window.MB_EXT = window.MB_EXT || []).push(function (MB) {
  'use strict';
  var S = MB.S, $ = MB.$, esc = MB.esc, gs = MB.gs, miles = MB.miles, fecha = MB.fecha, plural = MB.plural,
    badge = MB.badge, boton = MB.boton, attr = MB.attr, tabla = MB.tabla, kpi = MB.kpi, cabecera = MB.cabecera,
    subtabs = MB.subtabs, campo = MB.campo, inputGs = MB.inputGs, api = MB.api, toast = MB.toast, fallo = MB.fallo,
    conBoton = MB.conBoton, abrirModal = MB.abrirModal, requerir = MB.requerir, enteroDe = MB.enteroDe,
    norm = MB.norm, uid = MB.uid, sumarDias = MB.sumarDias;

  // Estado de las pantallas de cartera (filtros, selección y lo que se carga a pedido).
  var C = S.cartera = {
    q: '', filtro: 'saldo', qCred: '', filtroCred: 'abiertos', abiertos: {}, qCob: '', filtroCob: 'todos', sel: {}, fechaConc: '',
    verTodo: {}, cierre: null, manual: { marangatu: '', extractos: {} }, migracion: null, migConfirmo: false, informe: null, ficha: null,
  };
  MB.sistemaExtra = MB.sistemaExtra || [];

  // ═════════════ Utilidades ═════════════
  function D() { return S.datos; }
  function hayCartera() { return !!(S.datos && S.datos.cartera); }
  function K() { return S.datos.cartera; }
  function P() { return (S.datos.cartera && S.datos.cartera.parametros) || {}; }
  function esAdmin() { return MB.esAdmin(); }
  function render() { MB.render(); }
  function porc(fraccion) { return fraccion === null || fraccion === undefined || isNaN(fraccion) ? '—' : MB.pct(Number(fraccion) * 100); }
  function minus(t) { return String(t === null || t === undefined ? '' : t).toLowerCase(); }
  function opcion(valor, texto, sel) { return '<option value="' + esc(valor) + '"' + (sel ? ' selected' : '') + '>' + esc(texto) + '</option>'; }
  function dato(etq, val, esHtml) { return '<div class="dato"><p class="dato-etq">' + esc(etq) + '</p><p class="dato-val">' + (esHtml ? val : esc(val)) + '</p></div>'; }
  function aviso(txt, tono) { return '<p class="aviso-linea' + (tono ? ' ' + tono : '') + '">' + esc(txt) + '</p>'; }
  function gsN(n) { return n === null || n === undefined || n === '' ? '—' : gs(n); }
  var FREC = { SEMANAL: ['Semanal', 'semanales', 'sem.'], QUINCENAL: ['Quincenal', 'quincenales', 'quinc.'], MENSUAL: ['Mensual', 'mensuales', 'mens.'] };
  function frec(f, i) { return (FREC[f] || FREC.SEMANAL)[i]; }

  // Estados con los textos literales del xlsx (CREDITOS!AC, CLIENTES!Q) y los del sistema.
  var TONOS = {
    'AL DÍA': 'ok', 'ATRASO HASTA 7': 'alerta', 'A CONFIRMAR': 'neutro', 'CANCELADO': 'ok', 'ANULADO': 'neutro', 'VIGENTE': 'ok',
    'HABILITADA': 'ok', 'SIN DEUDA': 'neutro', 'BLOQUEADA': 'error', 'EXCEDE LÍMITE': 'alerta', 'ASIGNAR CATEGORÍA': 'alerta', 'INACTIVA': 'neutro',
    'PAGADA': 'ok', 'PENDIENTE': 'neutro', 'PARCIAL': 'alerta', 'EN GRACIA': 'alerta', 'VENCIDA': 'error', 'VENCIDA (PARCIAL)': 'error', 'ANULADA': 'neutro',
    'CONFIRMADO': 'ok', 'EN DISPUTA': 'error', 'OK': 'ok', 'PENDIENTE DE CONCILIAR': 'alerta', 'REGISTRADO': 'ok', 'DESCARTADO': 'neutro',
    'LEGIBLE': 'neutro', 'DUDOSA': 'alerta', 'A INVESTIGAR': 'alerta', 'FALLO': 'error', 'AVISO': 'alerta', 'INFO': 'neutro',
  };
  function badgeEstado(e) {
    var k = String(e || '').trim().toUpperCase();
    if (!k) return '—';
    var tono = TONOS[k] || (/^ATRASO/.test(k) || /BLOQUE|VENCID|RECHAZ|COBRADO DE MÁS/.test(k) ? 'error' : 'neutro');
    return badge(k.charAt(0) + k.slice(1).toLowerCase(), tono);
  }
  // Atraso: hasta P_DIAS_BLOQUEO días es «alerta»; más, «error» (la clienta queda bloqueada para créditos nuevos).
  function tonoAtraso(atraso) { return atraso > (P().P_DIAS_BLOQUEO || 0) ? 'error' : 'alerta'; }

  function buscarCredito(ref) {
    var k = String(ref || '').trim().toUpperCase();
    if (!k || !hayCartera()) return null;
    var lista = K().creditos, i;
    for (i = 0; i < lista.length; i++) if (String(lista[i].id).toUpperCase() === k) return lista[i];
    for (i = 0; i < lista.length; i++) {
      if (lista[i].saldo > 0 && (String(lista[i].venta || '').toUpperCase() === k || String(lista[i].legado || '').toUpperCase() === k)) return lista[i];
    }
    for (i = 0; i < lista.length; i++) if (String(lista[i].venta || '').toUpperCase() === k) return lista[i];
    return null;
  }
  function creditosAbiertos(cliente) {
    return K().creditos.filter(function (c) { return c.saldo > 0 && (!cliente || c.codigoCliente === cliente); });
  }
  function clienta(codigo) { return (hayCartera() && MB.buscar(K().clientes, codigo)) || MB.buscar(D().peluquerias, codigo); }
  function categoria(nombre) {
    var cats = hayCartera() ? K().categorias : [];
    var k = String(nombre || '').trim().toUpperCase();
    for (var i = 0; i < cats.length; i++) if (cats[i].nombre === k) return cats[i];
    return null;
  }
  function categoriaBase() { return categoria('NUEVA') || (hayCartera() && K().categorias[0]) || null; }
  function categoriaDeClienta(codigo) { var c = clienta(codigo); return c ? categoria(c.categoria) : null; }
  function saldoInicialDe(c) {
    var lista = (hayCartera() && K().saldosIniciales) || [];
    return lista.filter(function (s) { return s.credito === c.id; })[0] ||
      lista.filter(function (s) { return s.tipo === 'SALDO INICIAL' && String(s.numero) === String(c.legado); })[0] || null;
  }
  function origenTexto(c) { return c.venta ? 'venta ' + c.venta : (c.legado ? 'saldo histórico N° ' + c.legado : minus(c.origen)); }
  function lineaCuotas(c) {
    if (!c.cuotas || !c.cuotas.length) return 'Plan A CONFIRMAR: sin cuotas todavía; los cobros se aplican a cuenta del saldo.';
    return c.cuotas.map(function (q) {
      var falta = q.monto - q.pagado;
      return (q.n === 0 ? 'Entrega' : 'C' + q.n) + ' ' + fecha(q.vto).slice(0, 5) + ' ' + miles(q.monto) +
        (falta <= 0 ? ' ✓' : (q.pagado > 0 ? ' (falta ' + miles(falta) + ')' : '')) + (/VENCIDA/.test(q.estado) ? ' · vencida' : '');
    }).join('  ·  ');
  }
  function resumenPlanTexto(c) {
    if (!c.cuotas || !c.cuotas.length) return 'Plan A CONFIRMAR';
    var cuotas = c.cuotas.filter(function (q) { return q.n > 0; });
    return (Number(c.entrega) ? 'Entrega ' + miles(c.entrega) + ' + ' : '') + cuotas.length + ' × ' + miles(c.montoCuota || (cuotas[0] ? cuotas[0].monto : 0)) + ' ' +
      frec(c.frecuencia, 2) + (c.recargo ? ' · recargo ' + miles(c.recargo) : '');
  }

  // ═════════════ Plan de pagos: estimación con las mismas fórmulas del servidor (el servidor decide) ═════════════
  function excel15(x) { return Number(Number(x).toPrecision(15)); }
  function redondear(x, m) { var q = excel15(x / m); return (q >= 0 ? Math.floor(q + 0.5) : -Math.floor(-q + 0.5)) * m; }
  function abajo(x, m) { var q = excel15(x / m); return (q >= 0 ? Math.floor(q) : -Math.floor(-q)) * m; }
  function arriba(x, m) { var q = excel15(x / m); return (q >= 0 ? Math.ceil(q) : -Math.ceil(-q)) * m; }
  function diasFrecuencia(f) { var p = P(); return Number(f === 'QUINCENAL' ? p.P_FREC_QUINCENAL : (f === 'MENSUAL' ? p.P_FREC_MENSUAL : p.P_FREC_SEMANAL)) || 7; }
  function frecuenciaPermitida(cat, f) { return f === 'SEMANAL' || (f !== 'MENSUAL' && !!cat && cat.frecuencias.indexOf(f) >= 0); }
  function parametrosCompletos() {
    var p = P();
    return ['P_PLAZO_SIN_REC', 'P_TEA_FIN', 'P_LIMITE_BCP', 'P_RED_CUOTA', 'P_FREC_SEMANAL', 'P_CUOTA_MIN', 'P_MAX_CUOTAS', 'P_MIN_CREDITO'].every(function (k) {
      return p[k] !== null && p[k] !== undefined && p[k] !== '';
    });
  }
  function estimarPlan(e, cat) {
    var p = P();
    var frecuencia = e.frecuencia || 'SEMANAL';
    var dias = diasFrecuencia(frecuencia);
    var n = Math.max(1, Math.floor(Number(e.cuotas) || 1));
    var subtotal = Math.max(0, Math.round(Number(e.subtotal) || 0));
    var entrega = Math.max(0, Math.round(Number(e.entrega) || 0));
    var base0 = cat || categoriaBase();
    var pctEntrega = Math.max(base0 ? Number(base0.entrega) || 0 : 0, e.equipamiento ? Number(p.P_ENTREGA_EQUIPO) || 0 : 0);
    var plazo = n * dias, promedio = dias * (n + 1) / 2, base = Math.max(0, subtotal - entrega), recargo = 0, limitado = false;
    if (plazo > p.P_PLAZO_SIN_REC && base > 0) {
      recargo = redondear(base * (Math.pow(1 + p.P_TEA_FIN, promedio / 365) - 1), 1000);
      if (recargo > 0 && Math.pow(1 + recargo / base, 365 / promedio) - 1 > p.P_LIMITE_BCP + 1e-12) {
        recargo = Math.max(0, abajo(base * (Math.pow(1 + p.P_LIMITE_BCP, promedio / 365) - 1), 1000));
        limitado = true;
      }
    }
    var total = subtotal + recargo, financiado = Math.max(0, total - entrega);
    var cuota = n <= 1 ? financiado : abajo(financiado / n, Number(p.P_RED_CUOTA) || 1000);
    var primerVto = e.primerVto || sumarDias(e.fecha, dias);
    return {
      frecuencia: frecuencia, dias: dias, n: n, subtotal: subtotal, entrega: entrega, entregaMinima: arriba(subtotal * pctEntrega, 1000), pctEntrega: pctEntrega,
      primerVto: primerVto, ultimoVto: sumarDias(primerVto, (n - 1) * dias), plazo: plazo, recargo: recargo, limitado: limitado, total: total,
      financiado: financiado, cuota: cuota, ultima: financiado - (n - 1) * cuota,
    };
  }
  function textoPlan(e) {
    return (e.entrega ? 'entrega ' + gs(e.entrega) + ' + ' : '') + e.n + (e.n === 1 ? ' pago de ' : ' cuotas ' + frec(e.frecuencia, 1) + ' de ') + gs(e.cuota) +
      (e.ultima !== e.cuota ? ' (última ' + gs(e.ultima) + ')' : '') + (e.n === 1 ? ', el ' + fecha(e.primerVto) : ', del ' + fecha(e.primerVto) + ' al ' + fecha(e.ultimoVto)) + '. ' +
      (e.recargo ? 'Plazo de ' + e.plazo + ' días: recargo financiero ' + gs(e.recargo) + (e.limitado ? ' (ajustado al límite BCP)' : '') + '; total ' + gs(e.total) + '.'
        : 'Sin recargo (plazo de ' + e.plazo + ' días; hasta ' + P().P_PLAZO_SIN_REC + ' sin recargo).');
  }
  function esEquipamiento(p) {
    var linea = norm(p.linea || ''), eq = norm(P().P_LINEA_EQUIPO || '');
    if (linea && eq && linea === eq) return true;
    return /^equipo|equipamiento|mobiliario/.test(norm(p.categoria || ''));
  }
  function subtotalVenta(v) { return v.items.reduce(function (t, i) { return t + i.cantidad * i.precio; }, 0); }
  function estimadoVenta(v, subtotal) {
    var cat = v.cliente ? categoriaDeClienta(v.cliente) : null;
    var equipamiento = v.items.some(function (it) { var p = MB.buscar(D().productos, it.codigo); return !!p && esEquipamiento(p); });
    return {
      cat: cat,
      plan: estimarPlan({
        fecha: v.fecha || D().hoy, subtotal: subtotal, equipamiento: equipamiento, entrega: enteroDe(v.plan.entrega) || 0,
        cuotas: parseInt(v.plan.cuotas, 10) || 1, frecuencia: v.plan.frecuencia, primerVto: v.plan.primerVto,
      }, cat),
    };
  }
  function textoEstimado(v, subtotal) {
    var p = P();
    if (!parametrosCompletos()) return '<span class="negativo">Faltan parámetros de crédito (' + esc((p.faltan || []).join(', ') || 'revisar «Parámetros de crédito»') + '): el servidor no podrá calcular el plan.</span>';
    if (!v.items.length) return 'Agregue productos para ver el plan de pagos.';
    var est = estimadoVenta(v, subtotal), e = est.plan, cli = v.cliente ? clienta(v.cliente) : null;
    var avisos = [];
    if (!v.cliente) avisos.push('Elija la peluquería.');
    else if (!est.cat) avisos.push('ASIGNAR CATEGORÍA A LA CLIENTA (una administradora, en Cartera › Clientas).');
    if (subtotal < p.P_MIN_CREDITO) avisos.push('MONTO MENOR AL MÍNIMO PARA CRÉDITO (' + gs(p.P_MIN_CREDITO) + ').');
    if (e.entrega < e.entregaMinima) avisos.push('ENTREGA MENOR AL MÍNIMO: ' + gs(e.entregaMinima) + ' (' + porc(e.pctEntrega) + ').');
    if (e.n > 1 && e.cuota < p.P_CUOTA_MIN) avisos.push('CUOTA MENOR A LA MÍNIMA (' + gs(p.P_CUOTA_MIN) + ').');
    var catCuotas = est.cat || categoriaBase();
    if (catCuotas && e.n > catCuotas.cuotas) avisos.push('CUOTAS SOBRE EL MÁXIMO DE SU CATEGORÍA (' + catCuotas.cuotas + ').');
    if (!frecuenciaPermitida(est.cat, e.frecuencia)) avisos.push('FRECUENCIA REQUIERE AUTORIZACIÓN (de una administradora).');
    if (cli && cli.estado === 'BLOQUEADA') avisos.push('CLIENTA BLOQUEADA (atraso de ' + plural(cli.atraso || 0, 'día', 'días') + ').');
    if (est.cat && cli && (Number(cli.saldo) || 0) + e.total - (v.cobrarEntrega ? e.entrega : 0) > est.cat.limite) avisos.push('CLIENTA EXCEDE SU LÍMITE (' + gs(est.cat.limite) + ').');
    if (e.total > 0 && e.entrega >= e.total) avisos.push('LA ENTREGA CUBRE EL TOTAL: registre la venta al contado.');
    return esc('Estimado: ' + textoPlan(e)) + (avisos.length ? '<br><span class="negativo">' + esc(avisos.join(' ')) + '</span>' : '') +
      '<br><span class="det">El plan definitivo lo calcula y valida el sistema al pulsar «Revisar plan y registrar».</span>';
  }
  function actualizarEstimado() {
    var v = S.venta;
    if (!v || v.condicion !== 'Crédito' || !hayCartera()) return;
    var sub = subtotalVenta(v);
    var el = $('#v-plan-estimado');
    if (el) el.innerHTML = textoEstimado(v, sub);
    var m = $('#v-entrega-min');
    if (m) {
      var e = estimadoVenta(v, sub).plan;
      m.textContent = v.items.length && e.entregaMinima ? 'Mínimo ' + gs(e.entregaMinima) + ' (' + porc(e.pctEntrega) + ')' : '';
    }
  }

  function situacionClienta(codigo) {
    var c = clienta(codigo);
    if (!c) return '';
    var cat = categoriaDeClienta(codigo);
    var estado = c.estado || c.estadoCredito || '';
    var html = '<div class="datos-clienta mt">' +
      dato('Categoría', cat ? cat.nombre : 'Sin categoría') + dato('Límite', cat ? gs(cat.limite) : '—') + dato('Saldo actual', gs(c.saldo || 0)) +
      dato('Disponible', cat ? gs(c.disponible) : '—') + dato('Estado', badgeEstado(estado), true) +
      dato('Atraso', c.atraso ? plural(c.atraso, 'día', 'días') : 'Sin atraso') + '</div>';
    if (cat) {
      html += '<p class="ayuda mt">Categoría ' + esc(cat.nombre) + ': entrega mínima ' + porc(cat.entrega) + ', hasta ' + cat.cuotas + ' cuotas, frecuencia ' +
        esc(cat.frecuencias.map(minus).join(' o ')) + '.</p>';
    } else {
      html += aviso('Sin categoría de crédito: una administradora debe asignarla (Cartera › Clientas) antes de venderle a crédito.', 'grave');
    }
    if (estado === 'BLOQUEADA') html += aviso('CLIENTA BLOQUEADA: tiene más de ' + (P().P_DIAS_BLOQUEO || 0) + ' días de atraso. No se le puede vender a crédito hasta que se ponga al día.', 'grave');
    else if (c.vencido > 0) html += aviso('La clienta tiene ' + gs(c.vencido) + ' vencidos: conviene cobrar antes de otorgar más crédito.');
    return html;
  }

  // Sección «Crédito y plan de pagos» del formulario de venta (Index.html la llama al elegir «Crédito»).
  function seccionCredito(v, subtotal) {

  // ═════════════ Cobro (cascada: entrega → cuota más antigua → siguientes) ═════════════
  function simularCascada(c, monto) {
    var partes = [], resto = monto;
    var cuotas = (c.cuotas || []).slice().sort(function (a, b) { return a.n - b.n; });
    cuotas.forEach(function (q) {
      if (resto <= 0) return;
      var falta = q.monto - q.pagado;
      if (falta <= 0) return;
      var a = Math.min(falta, resto);
      resto -= a;
      partes.push((q.n === 0 ? 'Entrega' : 'Cuota ' + q.n) + ' ' + miles(a) + (a < falta ? ' (parcial)' : ''));
    });
    if (resto > 0) partes.push((cuotas.length ? 'Excedente ' : 'A cuenta del saldo ') + miles(resto));
    return { partes: partes, saldoDespues: c.saldo - monto };
  }
  function fichaCredito(c) {
    return '<p class="ficha"><strong>' + esc(c.id) + '</strong> · ' + esc(origenTexto(c)) + ' · total ' + gs(c.total) + ' · cobrado ' + gs(c.cobrado) +
      ' · <strong>saldo ' + gs(c.saldo) + '</strong>' +
      (c.vencido > 0 ? ' · <span class="negativo">vencido ' + gs(c.vencido) + ' (' + plural(c.atraso, 'día', 'días') + ')</span>' : '') +
      (c.estado === 'A CONFIRMAR' ? ' · ' + badgeEstado('A CONFIRMAR') : '') +
      '<br><span class="lineas-cuotas">' + esc(lineaCuotas(c)) + '</span></p>';
  }
  function abrirCobro(op) {

    var c0 = op.credito ? buscarCredito(op.credito) : null;
    if (op.credito && !c0) { toast('No se encontró el crédito ' + op.credito + ' en la cartera.', 'error'); return; }
    if (c0 && !(c0.saldo > 0)) { toast('El crédito ' + c0.id + ' no tiene saldo pendiente.', 'aviso'); return; }
    var abiertos = creditosAbiertos();
    if (!abiertos.length) { toast('No hay créditos con saldo para cobrar.', 'aviso'); return; }
    var cliente = c0 ? c0.codigoCliente : (op.cliente || '');
    if (cliente && !creditosAbiertos(cliente).length) { toast('Esta clienta no tiene saldo pendiente.', 'aviso'); return; }
    var porCliente = {}, clientes = [];
    abiertos.forEach(function (c) {
      if (!porCliente[c.codigoCliente]) { porCliente[c.codigoCliente] = { codigo: c.codigoCliente, nombre: c.cliente, saldo: 0 }; clientes.push(porCliente[c.codigoCliente]); }
      porCliente[c.codigoCliente].saldo += c.saldo;

    clientes.sort(function (a, b) { return a.nombre < b.nombre ? -1 : 1; });
    var cuerpo = '<div class="form-grid">' +
      campo('Clienta *', '<select name="cliente">' + opcion('', 'Seleccione…', !cliente) + clientes.map(function (c) {

      '<div class="c-12" id="cobro-ficha"></div>' +
      campo('Monto cobrado (Gs.) *', inputGs('monto', ''), 'c-4') +

      '<div class="campo c-6" id="cobro-recibo"><label>N° de recibo *</label><input name="recibo" maxlength="30" value="' + esc(K().siguienteRecibo) +
      '"><span class="ayuda">Sugerido: el siguiente número libre (vale el del talonario).</span></div>' +
      '<div class="campo c-6" id="cobro-op" hidden><label>N° de operación / referencia *</label><input name="operacion" maxlength="40" placeholder="Del comprobante de la transferencia, QR o POS"></div>' +
      '<div class="c-12" id="cobro-mora" hidden><label class="check"><input type="checkbox" name="mora"> Es un cobro de recargo por mora (no descuenta del saldo)</label></div>' +
      campo('Nota', '<input name="nota" maxlength="200">', 'c-12') +
      '<div class="c-12"><p class="ficha" id="cobro-aplicacion"></p></div></div>';
    var st = { cliente: null, credito: null, auto: '' };
    abrirModal({
      titulo: 'Registrar cobro', ancho: true, cuerpo: cuerpo, aceptar: 'Registrar cobro',
      alCambiar: function (form) { actualizarCobro(form, st, c0); },
      alAceptar: function (f, id) {
        var cr = buscarCredito(f.credito);
        requerir(cr, 'Elija la clienta y el crédito.');
        var monto = enteroDe(f.monto);
        var mora = f.mora === true;
        requerir(monto > 0, 'FALTA MONTO del cobro.');
        requerir(mora || monto <= cr.saldo, 'PAGO MAYOR AL SALDO: el saldo del crédito es ' + gs(cr.saldo) + '.');
        requerir(f.fecha, 'FALTA FECHA del cobro.');

        requerir(!efectivo || f.recibo, 'FALTA N° DE RECIBO (cobro en efectivo).');
        requerir(efectivo || f.operacion, 'FALTA N° DE OPERACIÓN.');
        return api('registrarCobro', {
          credito: cr.id, fecha: f.fecha, monto: monto, medio: f.medio, recibo: efectivo ? f.recibo : '', operacion: efectivo ? '' : f.operacion,
          nota: f.nota, concepto: mora ? P().P_CONC_MORA : '',
        }, id);

    var form = $('#modal-form');

  function actualizarCobro(form, st, c0) {
    var el = form.elements;
    var cli = el.cliente.value;
    if (cli !== st.cliente) {
      st.cliente = cli;
      var lista = cli ? creditosAbiertos(cli) : [];
      var elegido = c0 && c0.codigoCliente === cli ? c0.id : (lista.length ? lista[0].id : '');
      el.credito.innerHTML = lista.length ? lista.map(function (c) {
        return opcion(c.id, c.id + ' · ' + origenTexto(c) + ' · saldo ' + gs(c.saldo) + (c.atraso ? ' · ' + c.atraso + ' d de atraso' : '') +
          (c.estado === 'A CONFIRMAR' ? ' · plan a confirmar' : ''), c.id === elegido);
      }).join('') : opcion('', '—', true);
      el.credito.disabled = !lista.length;
      st.credito = null;
    }
    var cr = buscarCredito(el.credito.value);
    if (st.credito !== el.credito.value) {
      st.credito = el.credito.value;
      var sugerido = cr ? (cr.vencido > 0 ? cr.vencido : (cr.aCobrar || cr.saldo)) : 0;
      if (!el.monto.value || el.monto.value === st.auto) {
        st.auto = sugerido ? miles(sugerido) : '';
        el.monto.value = st.auto;
      }
      $('#cobro-ficha').innerHTML = cr ? fichaCredito(cr) : '';
      var bm = $('#cobro-mora');
      bm.hidden = !(cr && cr.moraCobrable);
      if (bm.hidden) el.mora.checked = false;
    }
    var efectivo = el.medio.value === 'EFECTIVO';
    $('#cobro-recibo').hidden = !efectivo;
    $('#cobro-op').hidden = efectivo;
    var ap = $('#cobro-aplicacion');
    var monto = enteroDe(el.monto.value);
    if (!cr) { ap.textContent = 'Elija la clienta y el crédito.'; return; }
    if (el.mora.checked) {
      ap.innerHTML = 'Recargo por mora: no descuenta del saldo (' + gs(cr.saldo) + ').' + (cr.moraSugerida ? ' Calculado a hoy: ' + gs(cr.moraSugerida) + '.' : '');
      return;
    }
    if (!(monto > 0)) { ap.textContent = 'Ingrese el monto cobrado.'; return; }
    if (monto > cr.saldo) { ap.innerHTML = '<span class="negativo">PAGO MAYOR AL SALDO: el saldo del crédito es ' + gs(cr.saldo) + '.</span>'; return; }
    var sim = simularCascada(cr, monto);
    ap.innerHTML = 'Se aplicará: <strong>' + esc(sim.partes.join(' · ')) + '</strong>. Saldo después: <strong>' + gs(sim.saldoDespues) + '</strong>' +
      (sim.saldoDespues <= 0 ? ' — cancela el crédito.' : '.') + ' Queda pendiente de conciliar con ' + (efectivo ? 'el arqueo de caja.' : 'el extracto.');
  }

  // ═════════════ Estado de cuenta (R0.6): el MISMO documento en pantalla, impreso en A4 y en PDF ═════════════

    z.innerHTML = cuerpo;
    var anterior = document.title;
    if (titulo) document.title = titulo;

    var fin = function () { document.body.classList.remove('imprimiendo'); document.title = anterior; window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    try {

      toast('El navegador no permitió imprimir desde la aplicación: use «Exportar PDF».', 'aviso', 9000);

  var renderPrevio = MB.alRender;
  MB.alRender = function () {
    if (renderPrevio) renderPrevio();
    if (S.vista === 'ventas' && S.sub.ventas === 'nueva') actualizarEstimado();
  };
});
</script>
